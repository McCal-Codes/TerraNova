[package]
name = "terranova"
version = "0.1.8-alpha.6"
description = "Offline design studio for Hytale World Generation V2"
authors = ["McCal <business@mcc-cal.com>"]
license = "LGPL-2.1"
edition = "2021"
rust-version = "1.77"

[lib]
name = "terranova_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnoise-lite = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# Sign in with Hytale (OIDC public client, PKCE S256). See docs/planning/adr-001-sign-in-with-hytale.md
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = "9"
url = "2"
sysinfo = "0.33"
zip = "2"
bridge-save = { path = "../tools/bridge-save" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
