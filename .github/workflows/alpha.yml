name: Alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix (e.g. 0.1.8-alpha.2)'
        required: true
        type: string
      publish:
        description: 'Create draft GitHub prerelease with artifacts (run once with false to verify builds first)'
        required: false
        type: boolean
        default: false
      sign:
        description: 'Sign updater artifacts (requires TAURI_SIGNING_* secrets on McCal-Codes/TerraNova)'
        required: false
        type: boolean
        default: true

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./tools/bridge-save -> target
            ./tools/terranova-bridge -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Verify version and changelog for release cut
        if: inputs.publish
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) must match workflow input ($INPUT_VERSION)"
            exit 1
          fi
          node scripts/release-notes.mjs "$INPUT_VERSION" >/dev/null

      - name: Alpha cut checklist
        run: |
          echo "Version: ${{ inputs.version }}"
          echo "publish=${{ inputs.publish }} sign=${{ inputs.sign }}"
          echo ""
          echo "Best practice (see docs/BETA_TESTING.md):"
          echo "  1. Run with publish=false to verify all platform builds."
          echo "  2. Re-run with publish=true for a draft prerelease."
          echo "  3. Paste docs/CHANGELOG.md [${{ inputs.version }}] sections into the release body."
          echo "  4. Use sign=true when TAURI_SIGNING_* secrets and tauri.conf.json pubkey are configured."

  package:
    needs: gate
    permissions:
      contents: write
    uses: ./.github/workflows/_package.yml
    with:
      version: ${{ inputs.version }}
      tag: v${{ inputs.version }}
      publish: ${{ inputs.publish }}
      sign: ${{ inputs.sign }}
    secrets: inherit
