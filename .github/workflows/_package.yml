name: Package TerraNova

on:
  workflow_call:
    inputs:
      version:
        description: Semver without v prefix (e.g. 0.1.8-alpha.2)
        required: true
        type: string
      tag:
        description: Git tag name (e.g. v0.1.8-alpha.2)
        required: true
        type: string
      publish:
        description: Upload draft GitHub release
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: ''
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    environment: Prod
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync version from input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Updating version to $VERSION"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const VERSION = process.env.VERSION;
            const tc = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            tc.version = VERSION;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tc, null, 2) + '\n');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            let cargo = fs.readFileSync('src-tauri/Cargo.toml','utf8');
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + VERSION + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "
        shell: bash

      - name: Pin linuxdeploy to fix AppImage EGL rendering
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          TAURI_TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLS"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage -O "$TAURI_TOOLS/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLS/linuxdeploy-x86_64.AppImage"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        if: inputs.publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ inputs.tag }}
          releaseName: 'TerraNova ${{ inputs.tag }}'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }}

      - name: Build only (no release upload)
        if: ${{ !inputs.publish }}
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            pnpm tauri build --no-sign --target "${{ matrix.rust_target }}"
          else
            pnpm tauri build --no-sign
          fi

      - name: Fix AppImage symlinks and repackage
        if: matrix.platform == 'ubuntu-22.04' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(find src-tauri/target -type f -path '*/bundle/appimage/*.AppImage' \
            ! -name '*.sig' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping"
            exit 0
          fi
          echo "Found AppImage: $APPIMAGE"
          rm -rf squashfs-root
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          cd squashfs-root
          while IFS= read -r link; do
            TARGET=$(readlink "$link" || true)
            [ -z "$TARGET" ] && continue
            if [[ "$TARGET" = /* ]] || [ ! -e "$link" ]; then
              BASENAME=$(basename "$TARGET")
              REAL=$(find usr -type f -name "$BASENAME" | head -1)
              [ -z "$REAL" ] && [ -f "$BASENAME" ] && REAL="$BASENAME"
              if [ -n "$REAL" ]; then
                echo "Fixing symlink: $link -> $TARGET"
                rm "$link"
                ln -s "$REAL" "$link"
              fi
            fi
          done < <(find . -maxdepth 1 -type l)
          cd ..
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "$APPIMAGE"
          fi
          gh release upload "${{ inputs.tag }}" "$APPIMAGE" --clobber
          if [ -f "${APPIMAGE}.sig" ]; then
            gh release upload "${{ inputs.tag }}" "${APPIMAGE}.sig" --clobber
          fi
          if [ -f "${APPIMAGE}.sig" ]; then
            LATEST_JSON=$(mktemp)
            gh release download "${{ inputs.tag }}" -p 'latest.json' -D "$(dirname "$LATEST_JSON")" -O "$LATEST_JSON" || true
            if [ -f "$LATEST_JSON" ] && [ -s "$LATEST_JSON" ]; then
              NEW_SIG=$(cat "${APPIMAGE}.sig")
              node -e "
                const fs = require('fs');
                const latest = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
                const sig = process.argv[2];
                for (const [key, val] of Object.entries(latest.platforms || {})) {
                  if (val.url && val.url.includes('.AppImage')) {
                    val.signature = sig;
                  }
                }
                fs.writeFileSync(process.argv[1], JSON.stringify(latest, null, 2) + '\n');
              " "$LATEST_JSON" "$NEW_SIG"
              gh release upload "${{ inputs.tag }}" "$LATEST_JSON#latest.json" --clobber
            fi
            rm -f "$LATEST_JSON"
          fi
          rm -rf squashfs-root appimagetool

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find src-tauri/target -name "TerraNova.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign -dvv "$APP_PATH" 2>&1
            codesign --verify --deep --strict "$APP_PATH" 2>&1 || echo "Warning: Signature verification had issues"
          fi
