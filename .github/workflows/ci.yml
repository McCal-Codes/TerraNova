name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run

      - name: In-app docs integrity
        run: pnpm docs:check

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: bridge-save format check
        run: cargo fmt --check --manifest-path tools/bridge-save/Cargo.toml

      - name: bridge-save tests
        run: cargo test --manifest-path tools/bridge-save/Cargo.toml

      - name: terranova-bridge format check
        run: cargo fmt --check --manifest-path tools/terranova-bridge/Cargo.toml

      - name: terranova-bridge tests
        run: cargo test --manifest-path tools/terranova-bridge/Cargo.toml

      - name: Format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

  bridge-plugin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@3b1a29a14baee7e8b69ecb9e0e2296da934a2f32 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build TerraNova.Bridge JVM plugin
        working-directory: tools/terranova-bridge-plugin
        run: chmod +x gradlew && ./gradlew jar --no-daemon
