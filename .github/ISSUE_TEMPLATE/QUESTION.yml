name: Question
description: Ask a usage question about TerraNova (prefer Discord for fast alpha support when possible).
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For closed-alpha support, [TerraNova Discord](https://discord.gg/NHPzsjkQeu) is usually faster.
        Use this template when a public answer would help other testers too.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: App version, OS, and what you already tried (sync assets, export path, etc.).

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation Checklist
      options:
        - label: I searched [existing issues](https://github.com/McCal-Codes/TerraNova/issues) and docs first.
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/McCal-Codes/TerraNova/blob/main/CODE_OF_CONDUCT.md).
          required: true
