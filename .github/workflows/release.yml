name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.1.8-alpha.2)'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          distribution: temurin
          java-version: 25

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./tools/bridge-save -> target
            ./tools/terranova-bridge -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Bridge plugin JAR for Tauri embed
        working-directory: tools/terranova-bridge-plugin
        run: |
          chmod +x gradlew
          ./gradlew jar --no-daemon
          mkdir -p ../../src-tauri/assets/bridge-plugin
          JAR=$(ls -t build/libs/TerraNova.Bridge*.jar | grep -v plain | head -1)
          cp "$JAR" ../../src-tauri/assets/bridge-plugin/TerraNova.Bridge.jar
          test -s ../../src-tauri/assets/bridge-plugin/TerraNova.Bridge.jar

      - name: Validate (lint, build, test, docs, changelog, Rust)
        run: pnpm validate

  resolve:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sign: ${{ steps.v.outputs.sign }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - id: v
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          node scripts/validate-release-tag.mjs "$TAG" >/dev/null
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Sign all tag releases when TAURI_SIGNING_* secrets are configured (alpha/beta/rc too).
          echo "sign=true" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.v.outputs.version }}" ]; then
            echo "Tag version (${{ steps.v.outputs.version }}) must match package.json ($PKG_VERSION)"
            exit 1
          fi
          node scripts/release-notes.mjs "${{ steps.v.outputs.version }}" >/dev/null

  package:
    needs: [resolve, validate]
    permissions:
      contents: write
    uses: ./.github/workflows/_package.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ needs.resolve.outputs.tag }}
      publish: true
      sign: ${{ needs.resolve.outputs.sign == 'true' }}
    secrets: inherit
