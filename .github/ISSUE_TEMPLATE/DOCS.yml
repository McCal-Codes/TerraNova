name: Documentation
description: Report missing, outdated, or unclear TerraNova documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Where did you look?
      description: In-app docs panel topic, README section, BETA_TESTING.md path, or URL.
      placeholder: docs/BETA_TESTING.md — Pack backup section
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe the gap, outdated step, or confusing wording.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should it say instead?
      description: Optional suggested wording or outline.

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation Checklist
      options:
        - label: I have checked the existing [issues](https://github.com/McCal-Codes/TerraNova/issues) for duplicates.
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/McCal-Codes/TerraNova/blob/main/CODE_OF_CONDUCT.md).
          required: true
