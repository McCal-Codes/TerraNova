name: Package TerraNova

on:
  workflow_call:
    inputs:
      version:
        description: Semver without v prefix (e.g. 0.1.8-alpha.2)
        required: true
        type: string
      tag:
        description: Git tag name (e.g. v0.1.8-alpha.2)
        required: true
        type: string
      publish:
        description: Upload draft GitHub release
        required: false
        type: boolean
        default: true
      sign:
        description: Sign updater artifacts (requires valid TAURI_SIGNING_* secrets)
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: ''
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    environment: Prod
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}-${{ matrix.rust_target || 'default' }}

      - name: Sync version from input
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/sync-app-version.mjs "$VERSION"
        shell: bash

      - name: Pin linuxdeploy to fix AppImage EGL rendering
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          TAURI_TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLS"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage -O "$TAURI_TOOLS/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLS/linuxdeploy-x86_64.AppImage"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release notes
        if: inputs.publish
        id: release_notes
        shell: bash
        run: |
          BODY=$(node scripts/release-notes.mjs "${{ inputs.version }}")
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "$BODY"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release (signed)
        if: inputs.publish && inputs.sign
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TERRANOVA_HYTALE_CLIENT_ID: ${{ secrets.TERRANOVA_HYTALE_CLIENT_ID }}
        with:
          # Generates latest.json and uploads it to the draft release. Each
          # parallel build adds its own platforms to the same asset rather than
          # replacing it — v0.1.8-alpha.4 shipped a manifest with all eleven
          # platform entries this way.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ inputs.tag }}
          releaseName: 'TerraNova ${{ inputs.tag }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }}

      - name: Build and release (unsigned)
        if: inputs.publish && !inputs.sign
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERRANOVA_HYTALE_CLIENT_ID: ${{ secrets.TERRANOVA_HYTALE_CLIENT_ID }}
        with:
          includeUpdaterJson: false
          tagName: ${{ inputs.tag }}
          releaseName: 'TerraNova ${{ inputs.tag }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.rust_target != '' && format('--no-sign --target {0}', matrix.rust_target) || '--no-sign' }}

      - name: Build only (no release upload)
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          TERRANOVA_HYTALE_CLIENT_ID: ${{ secrets.TERRANOVA_HYTALE_CLIENT_ID }}
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            pnpm tauri build --no-sign --target "${{ matrix.rust_target }}"
          else
            pnpm tauri build --no-sign
          fi

      - name: Fix AppImage symlinks and repackage
        if: matrix.platform == 'ubuntu-22.04' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          APPIMAGE=$(find src-tauri/target -type f -path '*/bundle/appimage/*.AppImage' \
            ! -name '*.sig' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping"
            exit 0
          fi
          echo "Found AppImage: $APPIMAGE"
          rm -rf squashfs-root
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          cd squashfs-root
          while IFS= read -r link; do
            TARGET=$(readlink "$link" || true)
            [ -z "$TARGET" ] && continue
            if [[ "$TARGET" = /* ]] || [ ! -e "$link" ]; then
              BASENAME=$(basename "$TARGET")
              REAL=$(find usr -type f -name "$BASENAME" | head -1)
              [ -z "$REAL" ] && [ -f "$BASENAME" ] && REAL="$BASENAME"
              if [ -n "$REAL" ]; then
                echo "Fixing symlink: $link -> $TARGET"
                rm "$link"
                ln -s "$REAL" "$link"
              fi
            fi
          done < <(find . -maxdepth 1 -type l)
          cd ..
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "$APPIMAGE"
          fi
          gh release upload "${{ inputs.tag }}" "$APPIMAGE" --clobber
          if [ -f "${APPIMAGE}.sig" ]; then
            gh release upload "${{ inputs.tag }}" "${APPIMAGE}.sig" --clobber
          fi
          # The repacked AppImage above no longer matches the signature Tauri
          # recorded in latest.json. Repairing it here does not stick — the
          # other three builds upload their own manifest afterwards and put the
          # stale signature back — so the finalize job does it once they are all
          # done. Uploading the .sig is what finalize reads.
          rm -rf squashfs-root appimagetool

      - name: Verify macOS bundle artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG=$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' 2>/dev/null | head -1)
          APP_PATH=$(find src-tauri/target -name "TerraNova.app" -type d 2>/dev/null | head -1)
          if [ -z "$DMG" ] && [ -z "$APP_PATH" ]; then
            echo "No macOS .dmg or TerraNova.app found under src-tauri/target"
            find src-tauri/target -maxdepth 5 -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          if [ -n "$DMG" ]; then
            echo "DMG: $DMG"
            ls -lh "$DMG"
          fi
          if [ -n "$APP_PATH" ]; then
            echo "APP: $APP_PATH"
            codesign -dvv "$APP_PATH" 2>&1 || echo "Note: unsigned app (expected for --no-sign CI builds)"
            codesign --verify --deep --strict "$APP_PATH" 2>&1 || echo "Note: strict verify skipped for unsigned CI builds"
          fi

  finalize:
    if: inputs.publish && needs.build.result == 'success'
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Publish release and set GitHub flags for in-app updater
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          META=$(node scripts/validate-release-tag.mjs "$TAG")
          IS_PRERELEASE=$(node -p "JSON.parse(process.argv[1]).isPrerelease" "$META")
          MAKE_LATEST=$(node -p "JSON.parse(process.argv[1]).makeLatest" "$META")
          if [ "$IS_PRERELEASE" = "true" ]; then
            # --latest is deliberately not passed here. GitHub will not make a
            # prerelease the "latest" release, so it silently does nothing and
            # /releases/latest keeps resolving to the channel release below.
            gh release edit "$TAG" --draft=false --prerelease=true
            echo "Prerelease $TAG: published, prerelease=true"
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest="$MAKE_LATEST"
            echo "Stable $TAG: published, prerelease=false, latest=$MAKE_LATEST"
          fi

      - name: Point the in-app updater at this build
        if: inputs.sign
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          META=$(node scripts/validate-release-tag.mjs "$TAG")
          IS_PRERELEASE=$(node -p "JSON.parse(process.argv[1]).isPrerelease" "$META")

          WORK=$(mktemp -d)
          gh release download "$TAG" -p 'latest.json' -D "$WORK"

          # The Linux job repacks the AppImage after Tauri signs it, which
          # invalidates the signature recorded in the manifest. Patching it in
          # that job does not survive: the other three builds upload their own
          # manifest afterwards and put the stale signature back. Doing it here,
          # once every build has finished, is the only ordering that holds.
          if gh release download "$TAG" -p '*.AppImage.sig' -D "$WORK" 2>/dev/null; then
            APPIMAGE_SIG=$(cat "$WORK"/*.AppImage.sig)
            node -e '
              const fs = require("fs");
              const [file, sig] = process.argv.slice(1);
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              const fixed = [];
              for (const [name, entry] of Object.entries(manifest.platforms || {})) {
                if (entry.url?.includes(".AppImage") && entry.signature !== sig) {
                  entry.signature = sig;
                  fixed.push(name);
                }
              }
              fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
              console.log(fixed.length ? `Repaired AppImage signature for ${fixed.join(", ")}` : "AppImage signature already correct");
            ' "$WORK/latest.json" "$APPIMAGE_SIG"
            gh release upload "$TAG" "$WORK/latest.json#latest.json" --clobber
          fi

          # Every platform entry must carry a signature or the updater rejects it.
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const unsigned = Object.entries(m.platforms || {}).filter(([, v]) => !v.signature).map(([k]) => k);
            if (!Object.keys(m.platforms || {}).length) throw new Error("manifest lists no platforms");
            if (unsigned.length) throw new Error(`unsigned platforms: ${unsigned.join(", ")}`);
            console.log(`Manifest for ${m.version}: ${Object.keys(m.platforms).length} platforms, all signed`);
          ' "$WORK/latest.json"

          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "Stable release — /releases/latest already resolves to it."
            exit 0
          fi

          # Prereleases are never "latest" on GitHub, so the updater endpoint
          # reads a dedicated non-prerelease release that exists only to host
          # this manifest. Without this step a prerelease is published but never
          # delivered — which is how the updater sat on alpha.2 while alpha.3,
          # alpha.4 and alpha.6 shipped.
          CHANNEL_TAG=$(printf '%s' "$TAG" | sed -E 's/-([a-z]+)\.[0-9]+.*$/-\1-channel/')
          if [ "$CHANNEL_TAG" = "$TAG" ]; then
            echo "::error::Could not derive a channel tag from $TAG"
            exit 1
          fi
          if ! gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            echo "::error::Channel release $CHANNEL_TAG does not exist — the updater has nothing to read"
            exit 1
          fi
          gh release upload "$CHANNEL_TAG" "$WORK/latest.json#latest.json" --clobber
          echo "Updater channel $CHANNEL_TAG now serves $TAG"
