name: Alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix (e.g. 0.1.8-alpha.2)'
        required: true
        type: string
      publish:
        description: 'Create draft GitHub prerelease with artifacts'
        required: false
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./tools/bridge-save -> target
            ./tools/terranova-bridge -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Changelog version reminder
        run: |
          echo "Packaging version: ${{ inputs.version }}"
          echo "Before publish: promote docs/CHANGELOG.md Unreleased to [${{ inputs.version }}] and paste sections into the GitHub release body."

  package:
    needs: gate
    uses: ./.github/workflows/_package.yml
    with:
      version: ${{ inputs.version }}
      tag: v${{ inputs.version }}
      publish: ${{ inputs.publish }}
    secrets: inherit
